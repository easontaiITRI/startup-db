<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新創企業查詢資料庫</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--accent:#58a6ff;--accent2:#f78166;--accent3:#3fb950;--accent4:#d2a8ff;--text:#e6edf3;--text-muted:#8b949e;--text-dim:#484f58;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;}
.header-logo{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:rgba(88,166,255,0.1);border:1px solid rgba(88,166,255,0.3);padding:4px 8px;border-radius:4px;white-space:nowrap;}
.header-title{font-size:15px;font-weight:600;}
.header-sub{font-size:12px;color:var(--text-muted);margin-left:auto;}
.header-count{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent3);background:rgba(63,185,80,0.1);border:1px solid rgba(63,185,80,0.3);padding:3px 12px;border-radius:20px;}
.layout{display:flex;min-height:calc(100vh - 53px);}
.sidebar{width:260px;min-width:260px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;overflow-y:auto;height:calc(100vh - 53px);position:sticky;top:53px;}
.filter-section{margin-bottom:20px;}
.filter-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.filter-label::before{content:'';display:inline-block;width:3px;height:11px;background:var(--accent);border-radius:2px;}
.search-box{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;}
.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.1);}
.search-box::placeholder{color:var(--text-dim);}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:all .2s;white-space:nowrap;user-select:none;}
.chip:hover{background:var(--surface2);color:var(--text);}
.chip.active{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.5);color:var(--accent);}
.chip.active.red{background:rgba(247,129,102,.15);border-color:rgba(247,129,102,.5);color:var(--accent2);}
.chip.active.green{background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.5);color:var(--accent3);}
select.filter-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;color:var(--text);font-size:12px;font-family:inherit;outline:none;cursor:pointer;margin-bottom:7px;}
.reset-btn{width:100%;padding:8px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;}
.reset-btn:hover{background:rgba(247,129,102,.1);border-color:rgba(247,129,102,.4);color:var(--accent2);}
.main{flex:1;padding:18px;overflow:hidden;}
.result-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:7px;}
.result-num{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:var(--accent);}
.result-text{font-size:12px;color:var(--text-muted);}
.sort-group{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
.sort-select{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;color:var(--text);font-size:12px;outline:none;cursor:pointer;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:0;transition:opacity .2s;}
.card:hover{border-color:rgba(88,166,255,.4);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3);}
.card:hover::before{opacity:1;}
.card.has-risk{border-left:3px solid rgba(247,129,102,.5);}
.card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.card-seq{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);min-width:22px;margin-top:2px;}
.card-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;flex:1;}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;font-weight:500;flex-shrink:0;}
.tag-ai{background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.4);color:var(--accent);}
.tag-semi{background:rgba(210,168,255,.15);border:1px solid rgba(210,168,255,.4);color:var(--accent4);}
.tag-comm{background:rgba(63,185,80,.15);border:1px solid rgba(63,185,80,.4);color:var(--accent3);}
.tag-mil{background:rgba(247,129,102,.15);border:1px solid rgba(247,129,102,.4);color:var(--accent2);}
.tag-sec{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);color:#e6c200;}
.tag-other{background:rgba(139,148,158,.15);border:1px solid rgba(139,148,158,.3);color:var(--text-muted);}
.tag-risk{background:rgba(247,129,102,.2);border:1px solid rgba(247,129,102,.4);color:var(--accent2);}
.card-intro{font-size:11px;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:9px;}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--text-dim);}
.meta-item{display:flex;align-items:center;gap:3px;background:var(--surface2);padding:2px 6px;border-radius:4px;}
.empty-state{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--text-muted);}
.empty-icon{font-size:44px;margin-bottom:14px;}
.pagination{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);}
.page-btn{padding:5px 11px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);cursor:pointer;font-size:12px;transition:all .2s;}
.page-btn:hover,.page-btn.active{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.4);color:var(--accent);}
.page-btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}
.page-info{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-overlay.hidden{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto;position:relative;}
.modal-header{padding:22px 22px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text-muted);cursor:pointer;width:28px;height:28px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.modal-close:hover{color:var(--text);border-color:var(--accent);}
.modal-company-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;padding-right:36px;}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;}
.modal-body{padding:18px 22px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.info-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;}
.info-item.full{grid-column:1/-1;}
.info-key{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.info-val{font-size:12px;color:var(--text);line-height:1.6;word-break:break-word;white-space:pre-wrap;}
.info-val.mono{font-family:'JetBrains Mono',monospace;font-size:11px;}
.section-title{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;display:flex;align-items:center;gap:7px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">TCA × 工研院</div>
  <div class="header-title">新創企業查詢資料庫</div>
  <div class="header-sub">跨計畫盤點 2026/05</div>

</div>

    <button class="reset-btn" id="resetBtn">↺ 清除所有篩選</button>

  <div class="main">

      <span class="result-text">筆符合條件的新創企業</span>
      <div class="sort-group">排序
        <select class="sort-select" id="sortSelect">
          <option value="seq">序號</option>
          <option value="name">公司名稱</option>
          <option value="year">成立年份（舊→新）</option>
          <option value="yearDesc">成立年份（新→舊）</option>
          <option value="capital">資本額（高→低）</option>
        </select>
      </div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>
</div>
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-company-name" id="modalName"></div>
      <div class="modal-tags" id="modalTags"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

  document.getElementById('unitSelect').addEventListener('change',run);
  document.getElementById('sortSelect').addEventListener('change',run);
  document.getElementById('chipRisk').addEventListener('click',()=>{F.risk=!F.risk;document.getElementById('chipRisk').classList.toggle('active');document.getElementById('chipRisk').classList.toggle('red');run();});
  document.getElementById('chipAward').addEventListener('click',()=>{F.award=!F.award;document.getElementById('chipAward').classList.toggle('active');document.getElementById('chipAward').classList.toggle('green');run();});
  document.getElementById('resetBtn').addEventListener('click',reset);
  document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').classList.add('hidden'));
  document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').classList.add('hidden');});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalOverlay').classList.add('hidden');});
  document.getElementById('totalCount').textContent=DATA.length+' 筆';
  run();
}
function run(){
  F.q=document.getElementById('searchInput').value.toLowerCase();
  F.plan=document.getElementById('planSelect').value;
  F.unit=document.getElementById('unitSelect').value;
  const sort=document.getElementById('sortSelect').value;
  filtered=DATA.filter(r=>{
    if(F.q){const txt=[r.name,r.intro,r.product,r.awards,r.program,r.ceo,r.city,r.unit,r.plan,r.subplan].join(' ').toLowerCase();if(!txt.includes(F.q))return false;}
    if(F.industries.size>0&&![...F.industries].some(ind=>r.industry.trim()===ind.trim()))return false;
    if(F.regions.size>0&&!F.regions.has(r.region.trim()))return false;
    if(F.years.size>0&&!F.years.has(yearGroup(r.year)))return false;
    if(F.plan&&!r.plan.includes(F.plan))return false;
    if(F.unit&&!r.unit.includes(F.unit))return false;
    if(F.risk&&!r.risk)return false;
    if(F.award&&(!r.awards||r.awards==='無'))return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(sort==='name')return a.name.localeCompare(b.name,'zh-TW');
    if(sort==='year')return(parseInt(a.year)||999)-(parseInt(b.year)||999);
    if(sort==='yearDesc')return(parseInt(b.year)||0)-(parseInt(a.year)||0);
    if(sort==='capital')return(parseInt(b.capital)||0)-(parseInt(a.capital)||0);
    return(parseInt(a.id)||9999)-(parseInt(b.id)||9999);
  });
  page=1;
  document.getElementById('resultCount').textContent=filtered.length;
  renderCards();renderPagination();
}
function renderCards(){
  const start=(page-1)*PAGE,slice=filtered.slice(start,start+PAGE),grid=document.getElementById('cardGrid');
  if(!filtered.length){grid.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div>找不到符合條件的新創企業，請調整篩選條件</div></div>';return;}
  grid.innerHTML=slice.map(r=>{
    const ti=tagInfo(r.industry),hasRisk=!!r.risk,hasAward=r.awards&&r.awards!=='無',intro=r.intro||r.product||'（暫無簡介）',cap=fmtCap(r.capital),yr=fmtYear(r.year);
    return `<div class="card${hasRisk?' has-risk':''}" data-id="${esc(r.id)}">
      <div class="card-header"><div class="card-seq">#${esc(r.id)}</div><div class="card-name">${esc(r.name)}</div><span class="tag ${ti.cls}">${esc(ti.label)}</span></div>
      <div class="card-intro">${esc(intro)}</div>
      <div class="card-meta">
        ${r.city?`<span class="meta-item">📍${esc(r.city)}</span>`:''}
        ${yr!=='—'?`<span class="meta-item">📅${yr}</span>`:''}
        ${cap!=='—'?`<span class="meta-item">💰${cap}</span>`:''}
        ${hasRisk?'<span class="meta-item tag tag-risk">⚠ 風險</span>':''}
        ${hasAward?'<span class="meta-item tag tag-comm">🏆 得獎</span>':''}
      </div></div>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>showDetail(el.dataset.id)));
}
function renderPagination(){
  const total=Math.ceil(filtered.length/PAGE),pg=document.getElementById('pagination');
  if(total<=1){pg.innerHTML='';return;}
  let h=`<button class="page-btn" id="prevBtn" ${page===1?'disabled':''}>← 上一頁</button>`;
  const range=[];for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++)range.push(i);
  if(range[0]>1){h+=`<button class="page-btn" data-pg="1">1</button>`;if(range[0]>2)h+='<span class="page-info">…</span>';}
  range.forEach(i=>{h+=`<button class="page-btn${i===page?' active':''}" data-pg="${i}">${i}</button>`;});
  if(range[range.length-1]<total){if(range[range.length-1]<total-1)h+='<span class="page-info">…</span>';h+=`<button class="page-btn" data-pg="${total}">${total}</button>`;}
  h+=`<button class="page-btn" id="nextBtn" ${page===total?'disabled':''}>下一頁 →</button>`;
  h+=`<span class="page-info">${page}/${total}</span>`;
  pg.innerHTML=h;
  pg.querySelectorAll('[data-pg]').forEach(b=>b.addEventListener('click',()=>goPage(parseInt(b.dataset.pg))));
  const prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');
  if(prev)prev.addEventListener('click',()=>goPage(page-1));
  if(next)next.addEventListener('click',()=>goPage(page+1));
}
function goPage(n){const total=Math.ceil(filtered.length/PAGE);page=Math.max(1,Math.min(n,total));renderCards();renderPagination();document.querySelector('.main').scrollTop=0;}
function showDetail(id){
  const r=DATA.find(x=>x.id===id);if(!r)return;
  document.getElementById('modalName').textContent=r.name;
  const ti=tagInfo(r.industry);
  document.getElementById('modalTags').innerHTML=[
    `<span class="tag ${ti.cls}">${esc(r.industry.trim()||'其他')}</span>`,
    r.region?`<span class="tag tag-other">📍 ${esc(r.region)}</span>`:'',
    r.risk?`<span class="tag tag-risk">⚠ 有風險</span>`:'',
  ].filter(Boolean).join('');
  const cap=fmtCap(r.capital),yr=fmtYear(r.year),emp=r.employees&&r.employees!=='0'?r.employees+' 人':'—';
  document.getElementById('modalBody').innerHTML=`
    <div class="section-title">基本資訊</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-key">負責人</div><div class="info-val">${esc(r.ceo)||'—'}</div></div>
      <div class="info-item"><div class="info-key">成立年份</div><div class="info-val">${yr}</div></div>
      <div class="info-item"><div class="info-key">公司所在縣市</div><div class="info-val">${esc(r.city)||'—'}</div></div>
      <div class="info-item"><div class="info-key">統一編號</div><div class="info-val mono">${esc(r.taxid)||'—'}</div></div>
      <div class="info-item"><div class="info-key">員工人數</div><div class="info-val">${emp}</div></div>
      <div class="info-item"><div class="info-key">實收資本額</div><div class="info-val">${cap}</div></div>
      ${r.contact?`<div class="info-item full"><div class="info-key">聯絡資訊</div><div class="info-val">${esc(r.contact)}</div></div>`:''}
    </div>
    ${r.risk?`<div class="section-title">⚠ 風險註記</div><div class="info-item" style="margin-bottom:14px;border-color:rgba(247,129,102,.4)"><div class="info-val" style="color:var(--accent2)">${esc(r.risk)}</div></div>`:''}
    <div class="section-title">公司簡介</div>
    <div class="info-item" style="margin-bottom:12px"><div class="info-val">${esc(r.intro)||'—'}</div></div>
    <div class="section-title">產品 / 服務</div>
    <div class="info-item" style="margin-bottom:12px"><div class="info-val">${esc(r.product)||'—'}</div></div>
    ${r.program?`<div class="section-title">計畫輔導項目</div><div class="info-item" style="margin-bottom:12px"><div class="info-val">${esc(r.program)}</div></div>`:''}
    ${r.subplan?`<div class="section-title">子分項計畫</div><div class="info-item" style="margin-bottom:12px"><div class="info-val">${esc(r.subplan)}</div></div>`:''}
    ${r.awards&&r.awards!=='無'?`<div class="section-title">🏆 曾獲獎項</div><div class="info-item" style="margin-bottom:12px"><div class="info-val">${esc(r.awards)}</div></div>`:''}
    <div class="section-title">計畫資訊</div>
    <div class="info-grid">
      <div class="info-item full"><div class="info-key">所屬計畫</div><div class="info-val">${esc(r.plan)||'—'}</div></div>
      <div class="info-item full"><div class="info-key">回報單位</div><div class="info-val">${esc(r.unit)||'—'}</div></div>
    </div>`;
  document.getElementById('modalOverlay').classList.remove('hidden');
}
function reset(){
  document.getElementById('searchInput').value='';
  document.getElementById('planSelect').value='';
  document.getElementById('unitSelect').value='';
  document.getElementById('sortSelect').value='seq';
  F.industries.clear();F.regions.clear();F.years.clear();F.risk=false;F.award=false;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active','red','green'));
  run();
}
init();
</script>
</body>
</html>
